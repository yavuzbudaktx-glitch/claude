name: Daily Britannica scrape

# Pulls britannica.com/on-this-day's Featured Event once a day and
# commits the result to public/data/featured-event.json. We do this on
# GitHub Actions because Britannica blocks Vercel's egress IPs (every
# server-side fetch from the deployed app returns 403); Actions runners
# sit on a different IP range and reach the site cleanly.

on:
  schedule:
    # GitHub's scheduled-workflow service is best-effort and routinely
    # delays runs by 5–12 hours, especially at popular minutes (and worst
    # at the top of the hour / midnight UTC). The only real defense is more
    # attempts at odd, off-peak minutes spread across the morning, so at
    # least one lands close to target. The script is idempotent — if the
    # file content hasn't changed the commit step is a no-op, so the extra
    # runs cost nothing. (June is CDT = UTC−5; times below are CDT.)
    - cron: "31 5 * * *"   # ≈ 00:31 — primary, just after Britannica's ET rollover
    - cron: "47 6 * * *"   # ≈ 01:47
    - cron: "13 8 * * *"   # ≈ 03:13
    - cron: "39 9 * * *"   # ≈ 04:39
    - cron: "9 11 * * *"   # ≈ 06:09 — should be ready before the workday
    - cron: "43 12 * * *"  # ≈ 07:43
    - cron: "21 14 * * *"  # ≈ 09:21
    - cron: "41 19 * * *"  # ≈ 14:41 — last-chance backstop
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so we can rebase our data commit onto whatever has
          # landed on the branch since checkout.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run scraper
        env:
          # Optional — when set, the script tries ScrapingBee first
          # (residential IPs, bypasses Britannica's anti-bot). Free tier
          # gives 1000 calls/month, plenty for one daily scrape. Without
          # the secret the script falls through to free options that
          # may also be blocked.
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
        run: node scripts/scrape-britannica.mjs

      - name: Commit & push if changed
        # Run even if the scrape step exited non-zero — the debug dump
        # is exactly what we need when nothing parsed.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          changed=""
          for f in public/data/featured-event.json public/data/debug-britannica-raw.txt; do
            if [[ -f "$f" && -n "$(git status --porcelain $f)" ]]; then
              git add "$f"
              changed="1"
            fi
          done
          if [[ -z "$changed" ]]; then
            echo "No change to commit."
            exit 0
          fi
          git commit -m "data: daily Britannica scrape (with debug dump)"
          # Push to the DEPLOYMENT branch explicitly. Scheduled GitHub Actions
          # crons run from the default branch by default, so without this the
          # data file would land on `main` and never reach the live
          # `claude/morning-dashboard-ak4rc` deployment (which was exactly why
          # the site kept reading a stale featured-event.json even though the
          # workflow ran green every night).
          branches="claude/morning-dashboard-ak4rc ${GITHUB_REF_NAME}"
          for branch in $branches; do
            echo "pushing to $branch"
            for i in 1 2 3 4 5; do
              if git push origin "HEAD:${branch}"; then
                echo "  pushed on attempt $i"
                break
              fi
              echo "  push rejected — rebasing onto origin/${branch} (attempt $i)"
              git fetch origin "$branch" || true
              git rebase "origin/${branch}" 2>/dev/null || { git rebase --abort 2>/dev/null || true; }
              sleep $((i * 3))
            done
          done
