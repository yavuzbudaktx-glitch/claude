name: Daily Britannica scrape

# Pulls britannica.com/on-this-day's Featured Event once a day and
# commits the result to public/data/featured-event.json. We do this on
# GitHub Actions because Britannica blocks Vercel's egress IPs (every
# server-side fetch from the deployed app returns 403); Actions runners
# sit on a different IP range and reach the site cleanly.

on:
  schedule:
    # 05:05 UTC ≈ 12:05 AM Central (during DST). Britannica rolls
    # their "/on-this-day/{month}-{day}" page over at the start of
    # each new day so picking up right after midnight Central catches
    # the fresh Featured Event.
    - cron: "5 5 * * *"
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run scraper
        env:
          # Optional — when set, the script tries ScrapingBee first
          # (residential IPs, bypasses Britannica's anti-bot). Free tier
          # gives 1000 calls/month, plenty for one daily scrape. Without
          # the secret the script falls through to free options that
          # may also be blocked.
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
        run: node scripts/scrape-britannica.mjs

      - name: Commit & push if changed
        # Run even if the scrape step exited non-zero — the debug dump
        # is exactly what we need when nothing parsed.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          changed=""
          for f in public/data/featured-event.json public/data/debug-britannica-raw.txt; do
            if [[ -f "$f" && -n "$(git status --porcelain $f)" ]]; then
              git add "$f"
              changed="1"
            fi
          done
          if [[ -n "$changed" ]]; then
            git commit -m "data: daily Britannica scrape (with debug dump)"
            git push
          else
            echo "No change to commit."
          fi
