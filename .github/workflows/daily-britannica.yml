name: Daily Britannica scrape

# Pulls britannica.com/on-this-day's Featured Event once a day and
# commits the result to public/data/featured-event.json. We do this on
# GitHub Actions because Britannica blocks Vercel's egress IPs (every
# server-side fetch from the deployed app returns 403); Actions runners
# sit on a different IP range and reach the site cleanly.

on:
  schedule:
    # 05:17 UTC ≈ 12:17 AM Central during DST. Deliberately an odd minute
    # (not the top of the hour): GitHub's scheduler delays/drops runs queued
    # at popular round times like ":00" under load.
    - cron: "17 5 * * *"
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so we can rebase our data commit onto whatever has
          # landed on the branch since checkout.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run scraper
        env:
          # Optional — when set, the script tries ScrapingBee first
          # (residential IPs, bypasses Britannica's anti-bot). Free tier
          # gives 1000 calls/month, plenty for one daily scrape. Without
          # the secret the script falls through to free options that
          # may also be blocked.
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
        run: node scripts/scrape-britannica.mjs

      - name: Commit & push if changed
        # Run even if the scrape step exited non-zero — the debug dump
        # is exactly what we need when nothing parsed.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          changed=""
          for f in public/data/featured-event.json public/data/debug-britannica-raw.txt; do
            if [[ -f "$f" && -n "$(git status --porcelain $f)" ]]; then
              git add "$f"
              changed="1"
            fi
          done
          if [[ -z "$changed" ]]; then
            echo "No change to commit."
            exit 0
          fi
          git commit -m "data: daily Britannica scrape (with debug dump)"
          # The default branch is also the active dev branch, so origin
          # very likely moved since checkout. Rebase our single data commit
          # on top and retry the push instead of failing on non-fast-forward.
          branch="${GITHUB_REF_NAME}"
          for i in 1 2 3 4 5; do
            if git push origin "HEAD:${branch}"; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push rejected — rebasing onto origin/${branch} (attempt $i)"
            git fetch origin "$branch"
            git rebase "origin/${branch}" || { git rebase --abort; exit 1; }
            sleep $((i * 3))
          done
          echo "push still failing after retries"
          exit 1
