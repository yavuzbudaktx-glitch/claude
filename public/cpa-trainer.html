<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1a19">
<title>CPA Trainer</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  color-scheme:light;
  --plane:#f9f9f7;--surface:#fcfcfb;--raised:#fff;
  --ink:#0b0b0b;--ink-2:#52514e;--muted:#898781;
  --grid:#e1e0d9;--axis:#c3c2b7;--ring:rgba(11,11,11,.10);
  --good:#0ca30c;--warning:#fab219;--serious:#ec835a;--critical:#d03b3b;
  --accent:#2a78d6;--accent-ink:#fff;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#4a3aa7;
  --sans:system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){
  color-scheme:dark;
  --plane:#0d0d0d;--surface:#1a1a19;--raised:#212120;
  --ink:#fff;--ink-2:#c3c2b7;--muted:#898781;
  --grid:#2c2c2a;--axis:#383835;--ring:rgba(255,255,255,.10);
  --accent:#3987e5;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#9085e9;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --plane:#0d0d0d;--surface:#1a1a19;--raised:#212120;
  --ink:#fff;--ink-2:#c3c2b7;--muted:#898781;
  --grid:#2c2c2a;--axis:#383835;--ring:rgba(255,255,255,.10);
  --accent:#3987e5;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#9085e9;
}
html,body{margin:0;padding:0}
body{background:var(--plane);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;
  overflow-x:hidden;-webkit-text-size-adjust:100%}
#app{max-width:840px;margin:0 auto;padding:20px 18px 120px}
button{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:640;letter-spacing:-.015em}

.bar-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-weight:660;font-size:17px;letter-spacing:-.02em}
.mark{width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;font-size:13px;font-weight:800}
.tools{display:flex;gap:6px;align-items:center}
.ghost{background:var(--surface);border:1px solid var(--ring);border-radius:9px;padding:7px 11px;
  cursor:pointer;font-size:12.5px;color:var(--ink-2)}
.ghost:hover{color:var(--ink);border-color:var(--axis)}

.secbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:18px;scrollbar-width:none}
.secbar::-webkit-scrollbar{display:none}
.secbtn{flex:none;background:var(--surface);border:1px solid var(--ring);border-radius:999px;
  padding:7px 14px;cursor:pointer;font-size:13px;font-weight:560;color:var(--ink-2);white-space:nowrap}
.secbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.secbtn i{font-style:normal;opacity:.7;font-size:11.5px;margin-left:5px}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--grid);margin-bottom:18px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px;cursor:pointer;
  color:var(--ink-2);font-size:13.5px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:620}

.card{background:var(--surface);border:1px solid var(--ring);border-radius:14px;padding:18px;margin-bottom:12px}
.card h3{font-size:14.5px;margin-bottom:4px}
.kicker{font-size:12.5px;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--ring);border-radius:12px;padding:13px 15px}
.tile .v{font-size:25px;font-weight:660;letter-spacing:-.02em}
.tile .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}

.meter{height:7px;border-radius:4px;background:var(--grid);overflow:hidden;margin-top:7px}
.meter>i{display:block;height:100%;border-radius:4px;transition:width .35s ease}
.arow{padding:11px 0;border-bottom:1px solid var(--grid)}
.arow:last-child{border-bottom:0}
.arow .t{display:flex;justify-content:space-between;gap:10px;font-size:13.2px;align-items:baseline}
.arow .n{color:var(--ink)}
.arow .m{color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums;white-space:nowrap}

.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:11px;padding:12px 18px;
  cursor:pointer;font-size:14.5px;font-weight:600;width:100%}
.btn:disabled{opacity:.5;cursor:default}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--ring)}
.btn.sm{padding:9px 14px;font-size:13px;width:auto}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

/* question */
.qmeta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.pillx{font-size:11px;font-weight:640;border-radius:999px;padding:3px 9px;border:1px solid var(--ring);color:var(--ink-2)}
.qtext{font-size:17px;line-height:1.5;margin-bottom:16px;letter-spacing:-.01em}
.choice{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);
  border:1.5px solid var(--ring);border-radius:12px;padding:13px 15px;margin-bottom:8px;cursor:pointer;
  font-size:14.5px;line-height:1.45;transition:border-color .12s,background .12s}
.choice:hover:not(:disabled){border-color:var(--axis)}
.choice:disabled{cursor:default}
.choice .ltr{flex:none;width:22px;height:22px;border-radius:6px;border:1.5px solid var(--axis);
  display:grid;place-items:center;font-size:11.5px;font-weight:700;color:var(--ink-2);margin-top:1px}
.choice.correct{border-color:var(--good);background:color-mix(in srgb,var(--good) 8%,transparent)}
.choice.correct .ltr{background:var(--good);border-color:var(--good);color:#fff}
.choice.wrong{border-color:var(--critical);background:color-mix(in srgb,var(--critical) 8%,transparent)}
.choice.wrong .ltr{background:var(--critical);border-color:var(--critical);color:#fff}
.choice.picked{border-color:var(--accent)}

.why{border-left:3px solid var(--accent);background:var(--plane);border-radius:0 10px 10px 0;
  padding:13px 15px;margin:14px 0;font-size:13.8px;line-height:1.6;color:var(--ink-2)}
.why b{color:var(--ink)}
.verdict{display:flex;align-items:center;gap:8px;font-weight:660;font-size:14.5px;margin-bottom:10px}
.verdict svg{width:17px;height:17px}
.v-ok{color:var(--good)}.v-no{color:var(--critical)}

.prog{height:4px;background:var(--grid);border-radius:3px;overflow:hidden;margin-bottom:16px}
.prog>i{display:block;height:100%;background:var(--accent);transition:width .3s}
.timer{font-variant-numeric:tabular-nums;font-weight:660;font-size:14px}
.timer.low{color:var(--critical)}

.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.foot{text-align:center;color:var(--muted);font-size:11.5px;margin-top:26px;line-height:1.7}
.kbd{font:11px var(--mono);border:1px solid var(--axis);border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--muted)}
@media (max-width:560px){#app{padding:16px 13px 100px}.qtext{font-size:16px}.tile .v{font-size:21px}}
</style>
</head>

<script id="bank" type="application/json">{"generated":"2026-08-04T10:35:37.336Z","sections":{"FAR":{"name":"Financial Accounting and Reporting","core":true,"areas":{"I":{"name":"Financial Reporting","weight":[30,40]},"II":{"name":"Select Balance Sheet Accounts","weight":[30,40]},"III":{"name":"Select Transactions","weight":[25,35]}}},"AUD":{"name":"Auditing and Attestation","core":true,"areas":{"I":{"name":"Ethics, Professional Responsibilities and General Principles","weight":[15,25]},"II":{"name":"Assessing Risk and Developing a Planned Response","weight":[25,35]},"III":{"name":"Performing Further Procedures and Obtaining Evidence","weight":[30,40]},"IV":{"name":"Forming Conclusions and Reporting","weight":[10,20]}}},"REG":{"name":"Taxation and Regulation","core":true,"areas":{"I":{"name":"Ethics, Professional Responsibilities and Federal Tax Procedures","weight":[10,20]},"II":{"name":"Business Law","weight":[15,25]},"III":{"name":"Federal Taxation of Property Transactions","weight":[5,15]},"IV":{"name":"Federal Taxation of Individuals","weight":[22,32]},"V":{"name":"Federal Taxation of Entities","weight":[23,33]}}},"BAR":{"name":"Business Analysis and Reporting","core":false,"areas":{"I":{"name":"Business Analysis","weight":[40,50]},"II":{"name":"Technical Accounting and Reporting","weight":[35,45]},"III":{"name":"State and Local Governments","weight":[10,20]}}},"ISC":{"name":"Information Systems and Controls","core":false,"areas":{"I":{"name":"Information Systems and Data Management","weight":[35,45]},"II":{"name":"Security, Confidentiality and Privacy","weight":[35,45]},"III":{"name":"Considerations for SOC Engagements","weight":[15,25]}}},"TCP":{"name":"Tax Compliance and Planning","core":false,"areas":{"I":{"name":"Tax Compliance and Planning for Individuals","weight":[30,40]},"II":{"name":"Entity Tax Compliance","weight":[30,40]},"III":{"name":"Entity Tax Planning","weight":[10,20]},"IV":{"name":"Property Transactions","weight":[10,20]}}}},"questions":[{"section":"FAR","area":"I","diff":2,"q":"Under ASC 606, which step of the five-step revenue model determines WHEN revenue is recognized?","choices":["Identify the contract","Identify the performance obligations","Determine the transaction price","Recognize revenue when (or as) each performance obligation is satisfied"],"answer":3,"why":"Steps 1–4 build up to the amount and the unit of account; step 5 is the timing step — control transfers, either at a point in time or over time.","tag":"ASC 606","id":"25v5fw"},{"section":"FAR","area":"I","diff":2,"q":"A performance obligation is satisfied OVER time if which condition is met?","choices":["The contract lasts more than one year","The customer simultaneously receives and consumes the benefits as the entity performs","The entity bills the customer monthly","The transaction price exceeds $1 million"],"answer":1,"why":"Over-time recognition requires one of three criteria; simultaneous receipt/consumption is the first. Billing frequency and contract length are irrelevant.","tag":"ASC 606","id":"9ytc4b"},{"section":"FAR","area":"I","diff":2,"q":"Which item is reported as a component of OTHER COMPREHENSIVE INCOME rather than net income?","choices":["Gain on sale of equipment","Unrealized gain on an available-for-sale debt security","Interest expense","Loss on inventory write-down"],"answer":1,"why":"AFS debt securities are marked to fair value through OCI. Trading securities and equity securities go through net income.","tag":"OCI","id":"1sqkzp2"},{"section":"FAR","area":"I","diff":3,"q":"A company has 100,000 common shares outstanding all year and reports net income of $500,000 with $50,000 of preferred dividends declared. Basic EPS is:","choices":["$5.00","$4.50","$5.50","$4.00"],"answer":1,"why":"Basic EPS = (Net income − preferred dividends) ÷ weighted average common shares = ($500,000 − $50,000) ÷ 100,000 = $4.50. Preferred dividends must be subtracted.","tag":"EPS","id":"qrjf7u"},{"section":"FAR","area":"I","diff":2,"q":"Under the INDIRECT method, depreciation expense appears on the statement of cash flows as:","choices":["An investing outflow","An addition to net income in operating activities","A financing inflow","A deduction from net income in operating activities"],"answer":1,"why":"Depreciation is a non-cash expense that reduced net income, so it is added back to reconcile to operating cash flow.","tag":"Cash flows","id":"v824vq"},{"section":"FAR","area":"I","diff":3,"q":"Cash paid to acquire the company's own treasury stock is classified in the statement of cash flows as:","choices":["Operating","Investing","Financing","A non-cash transaction disclosed only in the notes"],"answer":2,"why":"Transactions with the company's own equity holders — issuing or reacquiring stock, dividends, borrowings — are financing activities.","tag":"Cash flows","id":"fw11kp"},{"section":"FAR","area":"I","diff":2,"q":"Which change is accounted for RETROSPECTIVELY (restating prior periods)?","choices":["Change in accounting estimate","Change in accounting principle","Change in the useful life of equipment","Change in the estimated allowance for doubtful accounts"],"answer":1,"why":"Principle changes are retrospective. Estimate changes — useful lives, allowances, residual values — are prospective only.","tag":"Accounting changes","id":"tyt9bk"},{"section":"FAR","area":"I","diff":2,"q":"A not-for-profit entity classifies net assets as:","choices":["Unrestricted, temporarily restricted, permanently restricted","With donor restrictions and without donor restrictions","Restricted, committed, assigned, unassigned","Current and non-current"],"answer":1,"why":"ASU 2016-14 collapsed three classes into two: with and without donor restrictions. The three-class model is the superseded answer, and the four-category list is governmental fund balance.","tag":"NFP","id":"1sl5vcn"},{"section":"FAR","area":"I","diff":3,"q":"A contingent loss should be ACCRUED when it is:","choices":["Reasonably possible and estimable","Probable and reasonably estimable","Remote but material","Probable but not estimable"],"answer":1,"why":"Both conditions must hold: probable AND reasonably estimable. Reasonably possible means disclose only; probable but not estimable means disclose only.","tag":"Contingencies","id":"172ciyi"},{"section":"FAR","area":"II","diff":2,"q":"Under the allowance method, the entry to record estimated uncollectible accounts is:","choices":["Debit Bad Debt Expense, credit Accounts Receivable","Debit Bad Debt Expense, credit Allowance for Doubtful Accounts","Debit Allowance for Doubtful Accounts, credit Accounts Receivable","Debit Accounts Receivable, credit Bad Debt Expense"],"answer":1,"why":"The estimate credits the contra-asset allowance. Choice C is the later write-off of a specific account, which has no income statement effect.","tag":"Receivables","id":"1t7613z"},{"section":"FAR","area":"II","diff":3,"q":"Writing off a specific uncollectible account under the allowance method has what effect on NET accounts receivable?","choices":["Decreases it","Increases it","No effect","Depends on the amount"],"answer":2,"why":"The write-off debits the allowance and credits A/R by the same amount, so gross A/R and the allowance both fall — net realizable value is unchanged. This is a classic exam trap.","tag":"Receivables","id":"1xtp23j"},{"section":"FAR","area":"II","diff":3,"q":"Equipment costs $50,000 with a $5,000 salvage value and a 5-year life. Under DOUBLE-DECLINING BALANCE, depreciation in year 1 is:","choices":["$18,000","$20,000","$9,000","$10,000"],"answer":1,"why":"DDB rate = 2 ÷ 5 = 40%, applied to the full cost ignoring salvage in the early years: $50,000 × 40% = $20,000. Salvage only caps the final book value.","tag":"PP&E","id":"183ax0i"},{"section":"FAR","area":"II","diff":2,"q":"Which cost is CAPITALIZED as part of the cost of land?","choices":["Annual property taxes","Cost of razing an old building on the land to prepare it for use","Landscaping maintenance","Property insurance for the year"],"answer":1,"why":"Costs to get land ready for its intended use — clearing, grading, razing, title fees — are capitalized. Recurring costs are expensed.","tag":"PP&E","id":"10ztd4w"},{"section":"FAR","area":"II","diff":2,"q":"Inventory measured under a method other than LIFO or retail is reported at:","choices":["Lower of cost or market","Lower of cost or net realizable value","Net realizable value","Replacement cost"],"answer":1,"why":"ASU 2015-11 moved most inventory to lower of cost or NRV. LIFO and retail inventory still use the older lower-of-cost-or-market ceiling/floor test.","tag":"Inventory","id":"1t2o2u8"},{"section":"FAR","area":"II","diff":3,"q":"An investor owning 30% of an investee with significant influence uses the EQUITY method. When the investee reports net income, the investor:","choices":["Records dividend revenue only","Debits the investment account and credits equity in investee income","Credits the investment account","Makes no entry until dividends are received"],"answer":1,"why":"Under the equity method the investment rises by the investor's share of income. Dividends received then REDUCE the investment account — they are not revenue.","tag":"Investments","id":"55frb8"},{"section":"FAR","area":"II","diff":3,"q":"A long-lived asset held for use is tested for impairment. Step 1 compares the carrying amount to:","choices":["Fair value","Undiscounted future cash flows","Discounted future cash flows","Replacement cost"],"answer":1,"why":"The recoverability test uses UNDISCOUNTED cash flows. Only if carrying amount exceeds them do you measure the loss as carrying amount minus fair value.","tag":"Impairment","id":"18h1fw"},{"section":"FAR","area":"II","diff":2,"q":"Under ASC 842, a lessee recognizes a right-of-use asset and lease liability for:","choices":["Finance leases only","Operating leases only","Both finance and operating leases (short-term leases may be excluded by policy election)","Neither, unless ownership transfers"],"answer":2,"why":"ASC 842's central change: essentially all leases go on the balance sheet. The income statement pattern still differs — front-loaded for finance, straight-line for operating.","tag":"Leases","id":"l8b9a7"},{"section":"FAR","area":"II","diff":3,"q":"A deferred tax LIABILITY arises from:","choices":["A temporary difference where book income exceeds taxable income now","A permanent difference such as municipal bond interest","A temporary difference where taxable income exceeds book income now","A net operating loss carryforward"],"answer":0,"why":"Paying less tax now than book income implies means paying more later — a liability. Tax depreciation exceeding book depreciation is the classic case. Permanent differences never create deferred taxes.","tag":"Income taxes","id":"skp9ni"},{"section":"FAR","area":"III","diff":3,"q":"A bond is issued at a DISCOUNT. Under the effective interest method, interest expense each period:","choices":["Equals the cash coupon payment","Is less than the cash payment and decreases over time","Exceeds the cash payment and increases over time","Is constant over the bond's life"],"answer":2,"why":"Discount means the market rate exceeds the coupon rate. Expense = carrying value × market rate, and carrying value rises as the discount amortizes, so expense grows and always exceeds cash paid.","tag":"Bonds","id":"1szkq4g"},{"section":"FAR","area":"III","diff":2,"q":"In a business combination, goodwill is measured as:","choices":["The excess of the fair value of identifiable net assets over consideration transferred","The excess of consideration transferred (plus NCI) over the fair value of identifiable net assets acquired","The acquiree's book equity","Internally generated brand value"],"answer":1,"why":"Goodwill is the residual. When the relationship reverses you have a bargain purchase, recognized as a gain in earnings — not negative goodwill.","tag":"Business combinations","id":"4l323l"},{"section":"FAR","area":"III","diff":2,"q":"Goodwill is:","choices":["Amortized over 40 years","Amortized over its useful life","Tested for impairment at least annually and not amortized (absent a private-company election)","Written off immediately at acquisition"],"answer":2,"why":"Public companies do not amortize goodwill; they test at least annually at the reporting-unit level. Private companies may elect amortization over 10 years or less.","tag":"Business combinations","id":"1boko22"},{"section":"FAR","area":"III","diff":3,"q":"A company's bank reconciliation shows a deposit in transit. This item:","choices":["Is added to the bank balance","Is added to the book balance","Is subtracted from the bank balance","Requires an adjusting journal entry"],"answer":0,"why":"The company already recorded it; the bank has not. Bank-side items (deposits in transit, outstanding checks) never require journal entries — only book-side items do.","tag":"Cash","id":"1ixxe2a"},{"section":"FAR","area":"III","diff":2,"q":"Research and development costs under U.S. GAAP are generally:","choices":["Capitalized and amortized","Expensed as incurred","Capitalized if the project is probable of success","Deferred until the product launches"],"answer":1,"why":"U.S. GAAP expenses R&D as incurred. IFRS differs — development costs meeting specific criteria are capitalized, a common comparison question.","tag":"Intangibles","id":"m6aaag"},{"section":"AUD","area":"I","diff":2,"q":"Under the AICPA Code of Professional Conduct, independence is required for:","choices":["All engagements","Attest engagements such as audits and reviews","Tax return preparation","Consulting engagements"],"answer":1,"why":"Independence is an attest concept. Objectivity and integrity apply everywhere, but you may prepare tax returns for a client you are not independent of.","tag":"Independence","id":"17ac2sv"},{"section":"AUD","area":"I","diff":3,"q":"A CPA firm's audit partner owns shares directly in an audit client. This is:","choices":["Permitted if the amount is immaterial","Permitted if disclosed in the audit report","A direct financial interest that impairs independence regardless of materiality","Permitted if the shares are held in a blind trust"],"answer":2,"why":"Direct financial interests impair independence with no materiality threshold. Only INDIRECT interests get a materiality test.","tag":"Independence","id":"1thtao0"},{"section":"AUD","area":"I","diff":2,"q":"The purpose of an engagement letter is to:","choices":["Guarantee the accuracy of the financial statements","Establish an understanding of the terms, objectives, and responsibilities of the engagement","Waive the auditor's liability","Satisfy the SEC filing requirement"],"answer":1,"why":"The engagement letter documents scope, responsibilities of management and auditor, and limitations. Auditors never guarantee statements.","tag":"Engagement acceptance","id":"y060f8"},{"section":"AUD","area":"I","diff":2,"q":"Which best describes PROFESSIONAL SKEPTICISM?","choices":["Assuming management is dishonest","An attitude that includes a questioning mind and a critical assessment of evidence","Verifying 100% of transactions","Relying on management representations"],"answer":1,"why":"Skepticism is neither trust nor distrust — it is a questioning mind. Assuming dishonesty is not required; assuming honesty is not permitted.","tag":"Professional skepticism","id":"1ct50ag"},{"section":"AUD","area":"II","diff":3,"q":"In the audit risk model AR = IR × CR × DR, if the auditor assesses inherent and control risk as HIGH, detection risk must be set:","choices":["High, and less substantive testing performed","Low, requiring more persuasive substantive evidence","At zero","Unchanged — detection risk is not controllable"],"answer":1,"why":"Detection risk is the only element the auditor controls. Higher RMM forces lower acceptable detection risk, meaning more extensive, better-timed, more effective procedures.","tag":"Audit risk","id":"1pgvaxc"},{"section":"AUD","area":"II","diff":2,"q":"Which procedure would the auditor perform to obtain an understanding of internal control?","choices":["Confirm receivables with customers","Perform a walkthrough of a transaction from initiation to reporting","Recalculate depreciation expense","Observe the year-end inventory count"],"answer":1,"why":"Walkthroughs establish understanding of design and implementation. The others are substantive procedures.","tag":"Internal control","id":"1ey4gwf"},{"section":"AUD","area":"II","diff":2,"q":"Performance materiality is set:","choices":["Higher than overall materiality","Lower than overall materiality","Equal to overall materiality","At zero for public companies"],"answer":1,"why":"Performance materiality is set below overall materiality to leave room for undetected and aggregated misstatements.","tag":"Materiality","id":"yxqzag"},{"section":"AUD","area":"II","diff":3,"q":"A material weakness in internal control is a deficiency such that:","choices":["A misstatement is remotely possible","There is a reasonable possibility that a material misstatement will not be prevented or detected timely","The auditor must issue an adverse opinion on the financial statements","Management must be replaced"],"answer":1,"why":"Severity ladder: deficiency → significant deficiency (merits attention) → material weakness (reasonable possibility of material misstatement). A control weakness does not by itself change the financial statement opinion.","tag":"Internal control","id":"183mtq9"},{"section":"AUD","area":"III","diff":2,"q":"Which type of audit evidence is generally MOST reliable?","choices":["Internally generated documents","Management's oral representations","Evidence obtained directly by the auditor from an independent external source","Photocopies provided by the client"],"answer":2,"why":"Reliability rises with auditor-obtained, external, and original evidence. Directly obtained external confirmations sit at the top.","tag":"Evidence","id":"1b0tyo0"},{"section":"AUD","area":"III","diff":3,"q":"Accounts receivable confirmations primarily test which assertion?","choices":["Completeness","Existence","Valuation","Presentation"],"answer":1,"why":"Confirmations test EXISTENCE — the recorded receivable is real. They are weak for completeness (unrecorded receivables have nobody to confirm with) and for collectibility.","tag":"Assertions","id":"1qfrwq0"},{"section":"AUD","area":"III","diff":2,"q":"To test for UNRECORDED liabilities, the auditor would primarily:","choices":["Confirm accounts payable balances with vendors","Examine cash disbursements made after year-end for items relating to the prior period","Vouch recorded payables to invoices","Recalculate accrued interest"],"answer":1,"why":"Search-for-unrecorded-liabilities works backwards from subsequent payments. Vouching recorded items tests existence, not completeness.","tag":"Completeness","id":"x49po"},{"section":"AUD","area":"III","diff":2,"q":"The management representation letter is dated:","choices":["At the beginning of fieldwork","As of the date of the auditor's report","At the balance sheet date","Thirty days after the report"],"answer":1,"why":"The letter covers the full period through the report date, so it carries the report date. Refusal to provide it is a scope limitation leading to disclaimer or withdrawal.","tag":"Representations","id":"nognjy"},{"section":"AUD","area":"III","diff":3,"q":"Analytical procedures are REQUIRED in which phases of the audit?","choices":["Planning only","Substantive testing only","Risk assessment (planning) and the final overall review","All three phases"],"answer":2,"why":"Required at planning and near the end as an overall review. Using them as substantive tests is optional — the auditor may choose tests of details instead.","tag":"Analytical procedures","id":"725ioe"},{"section":"AUD","area":"IV","diff":3,"q":"The auditor cannot obtain sufficient appropriate evidence about a matter that is material AND pervasive. The appropriate opinion is:","choices":["Qualified","Adverse","Disclaimer of opinion","Unmodified with an emphasis-of-matter paragraph"],"answer":2,"why":"Two axes: a SCOPE problem gives qualified (material) or disclaimer (material and pervasive); a GAAP departure gives qualified or adverse. Scope + pervasive = disclaimer.","tag":"Reports","id":"mgf31d"},{"section":"AUD","area":"IV","diff":3,"q":"The financial statements contain a material GAAP departure that is pervasive. The opinion is:","choices":["Qualified","Adverse","Disclaimer","Unmodified"],"answer":1,"why":"A pervasive misstatement means the statements as a whole are not fairly presented — adverse. Contrast with a scope limitation, which would give a disclaimer.","tag":"Reports","id":"v7n2cb"},{"section":"AUD","area":"IV","diff":2,"q":"Substantial doubt about going concern that is adequately disclosed results in:","choices":["An adverse opinion","A disclaimer","An unmodified opinion with a separate going-concern section","A qualified opinion"],"answer":2,"why":"Adequate disclosure means the statements are fair — the opinion stays unmodified with an added emphasis section. Inadequate disclosure would make it a GAAP departure.","tag":"Going concern","id":"1vi5ulb"},{"section":"AUD","area":"IV","diff":2,"q":"A subsequent event that provides evidence about conditions existing AT the balance sheet date is:","choices":["Disclosed only","Recognized (adjusted) in the financial statements","Ignored","Reported as a prior period adjustment"],"answer":1,"why":"Type 1 (recognized) events adjust the statements — for example, settlement of pre-existing litigation. Type 2 events arise from new conditions and are disclosed only.","tag":"Subsequent events","id":"1eo97ii"},{"section":"REG","area":"I","diff":2,"q":"Circular 230 governs:","choices":["Auditor independence","Practice before the Internal Revenue Service","State board licensing","PCAOB inspections"],"answer":1,"why":"Circular 230 sets duties for those practicing before the IRS — CPAs, attorneys, enrolled agents — covering diligence, conflicts, and fee rules.","tag":"Circular 230","id":"6a989h"},{"section":"REG","area":"I","diff":3,"q":"The general statute of limitations for the IRS to assess additional tax is:","choices":["Three years from the later of the due date or filing date","Six years in all cases","Ten years","There is no limit"],"answer":0,"why":"Three years generally; six years if gross income is understated by more than 25%; unlimited for a false or fraudulent return or a failure to file.","tag":"Tax procedure","id":"1frbmpz"},{"section":"REG","area":"II","diff":2,"q":"Under the UCC, a contract for the sale of goods for $500 or more generally must be:","choices":["Notarized","In writing to be enforceable under the statute of frauds","Approved by both parties' attorneys","Recorded with the state"],"answer":1,"why":"UCC 2-201 statute of frauds. Exceptions include specially manufactured goods, admissions in court, and performance already accepted.","tag":"UCC","id":"pkomzn"},{"section":"REG","area":"II","diff":3,"q":"An agent acting within actual authority binds the principal. If the agent exceeds actual authority but the third party reasonably believes authority exists, the principal may still be bound by:","choices":["Ratification only","Apparent authority","Novation","Accord and satisfaction"],"answer":1,"why":"Apparent authority arises from the PRINCIPAL's manifestations to the third party. The agent cannot create it by their own claims.","tag":"Agency","id":"802jj0"},{"section":"REG","area":"II","diff":2,"q":"A security interest in personal property is generally perfected by:","choices":["Signing the security agreement alone","Filing a financing statement or taking possession of the collateral","Recording a deed","Notifying the debtor's other creditors"],"answer":1,"why":"Attachment makes the interest enforceable against the debtor; perfection — usually by filing — establishes priority against third parties.","tag":"Secured transactions","id":"19ogilo"},{"section":"REG","area":"III","diff":3,"q":"After the Tax Cuts and Jobs Act, Section 1031 like-kind exchange treatment applies only to:","choices":["Any business property","Real property held for productive use or investment","Personal property such as equipment","Inventory"],"answer":1,"why":"TCJA limited 1031 to real property. Equipment and other personal property no longer qualify — a heavily tested change.","tag":"Section 1031","id":"1ofdgaf"},{"section":"REG","area":"III","diff":3,"q":"Depreciation recapture under Section 1245 on the sale of equipment at a gain is characterized as:","choices":["Long-term capital gain","Ordinary income to the extent of prior depreciation taken","Section 1231 gain in full","Tax-exempt"],"answer":1,"why":"1245 recaptures ALL prior depreciation as ordinary income first; any excess above original cost is 1231 gain.","tag":"Recapture","id":"9zx786"},{"section":"REG","area":"III","diff":2,"q":"The basis of property received by GIFT, when the donor's basis is less than fair market value at the date of gift, is:","choices":["Fair market value at the date of gift","The donor's carryover basis","Zero","The average of basis and fair market value"],"answer":1,"why":"Carryover (transferred) basis for gifts. The dual-basis rule only kicks in when FMV is BELOW donor basis at gift date and the property is later sold at a loss.","tag":"Basis","id":"1ectmef"},{"section":"REG","area":"III","diff":2,"q":"The basis of property acquired from a DECEDENT is generally:","choices":["The decedent's adjusted basis","Fair market value at the date of death (or alternate valuation date)","Zero","Original purchase price"],"answer":1,"why":"The step-up (or step-down) to date-of-death FMV. Inherited property is also automatically long-term regardless of the holding period.","tag":"Basis","id":"vnmwnk"},{"section":"REG","area":"IV","diff":3,"q":"An individual's net long-term capital LOSS in excess of capital gains is deductible against ordinary income up to what amount per year (2024, single or MFJ)?","choices":["$1,500","$3,000","$10,000","Unlimited"],"answer":1,"why":"$3,000 per year ($1,500 if married filing separately) for 2024; the remainder carries forward indefinitely. Verify the figure for the year you sit.","tag":"Capital gains","id":"dxpm82"},{"section":"REG","area":"IV","diff":2,"q":"Which filing status generally produces the LOWEST tax liability for a qualifying taxpayer?","choices":["Single","Married filing separately","Married filing jointly","Head of household"],"answer":2,"why":"MFJ has the widest brackets and largest standard deduction. MFS is generally the least favorable and disqualifies several credits.","tag":"Filing status","id":"nu2nvc"},{"section":"REG","area":"IV","diff":3,"q":"Which item is an ABOVE-the-line deduction (adjustment to arrive at AGI)?","choices":["Mortgage interest","Charitable contributions","Deductible portion of self-employment tax","State income taxes"],"answer":2,"why":"One-half of SE tax is an adjustment. The others are itemized deductions taken below the line.","tag":"AGI","id":"1cidwc8"},{"section":"REG","area":"IV","diff":2,"q":"Interest on state and local municipal bonds is:","choices":["Fully taxable","Excluded from federal gross income","Taxable only if over $10,000","Deductible"],"answer":1,"why":"Municipal interest is excluded from federal gross income — a PERMANENT book-tax difference, which is why it never generates a deferred tax.","tag":"Gross income","id":"cg3pf3"},{"section":"REG","area":"IV","diff":3,"q":"The Section 199A qualified business income deduction is generally:","choices":["20% of QBI, subject to wage/property and taxable-income limitations","50% of QBI with no limits","A credit against tax","Available only to C corporations"],"answer":0,"why":"Up to 20% of QBI from pass-throughs, limited by W-2 wages and qualified property at higher income, and restricted for specified service trades or businesses.","tag":"QBI","id":"1vdllfq"},{"section":"REG","area":"V","diff":3,"q":"Under Section 351, a transferor recognizes NO gain on contributing property to a corporation if, immediately after the exchange, the transferors control:","choices":["50% or more of the corporation","80% or more of voting power and total shares","100% of the corporation","Any percentage, provided cash is not received"],"answer":1,"why":"Control means at least 80%. Boot received triggers gain recognition up to the lesser of realized gain or boot.","tag":"Section 351","id":"12kg89x"},{"section":"REG","area":"V","diff":3,"q":"A partner's basis in a partnership interest is INCREASED by:","choices":["Partnership distributions","The partner's share of partnership liabilities","The partner's share of partnership losses","Guaranteed payments received"],"answer":1,"why":"Debt share increases outside basis (Section 752). Distributions and losses reduce it. Basis can never fall below zero.","tag":"Partnership basis","id":"1juhl99"},{"section":"REG","area":"V","diff":3,"q":"An S corporation shareholder's basis, unlike a partner's, generally does NOT include:","choices":["Capital contributions","A share of entity-level liabilities","Allocated income","Direct shareholder loans to the corporation"],"answer":1,"why":"S shareholders get basis only for their own investment and direct loans — not for a share of corporate debt. This is the key S corp vs partnership distinction.","tag":"S corporation","id":"cr0kwc"},{"section":"REG","area":"V","diff":2,"q":"A C corporation's net capital losses may be:","choices":["Deducted in full against ordinary income","Carried back 3 years and forward 5 years, deductible only against capital gains","Deducted up to $3,000 per year","Carried forward indefinitely against ordinary income"],"answer":1,"why":"Corporations may only offset capital gains — no $3,000 ordinary offset, which is an individual rule.","tag":"C corporation","id":"1tosqo1"},{"section":"BAR","area":"I","diff":3,"q":"A company has fixed costs of $180,000, a unit selling price of $50, and unit variable cost of $30. The breakeven point in units is:","choices":["3,600 units","6,000 units","9,000 units","4,500 units"],"answer":2,"why":"Contribution margin per unit = $50 − $30 = $20. Breakeven = $180,000 ÷ $20 = 9,000 units.","tag":"CVP","id":"xcop9x"},{"section":"BAR","area":"I","diff":3,"q":"Using the data above, how many units must be sold to earn a target profit of $60,000?","choices":["12,000 units","9,000 units","10,500 units","3,000 units"],"answer":0,"why":"(Fixed costs + target profit) ÷ CM per unit = ($180,000 + $60,000) ÷ $20 = 12,000 units.","tag":"CVP","id":"1kjmaqy"},{"section":"BAR","area":"I","diff":2,"q":"A FAVORABLE direct materials price variance means:","choices":["More material was used than standard","The actual price paid was less than the standard price","Production exceeded budget","Fixed overhead was overapplied"],"answer":1,"why":"Price (rate) variances compare actual vs standard PRICE on actual quantity. Quantity used drives the usage variance instead.","tag":"Variance analysis","id":"1uss6mr"},{"section":"BAR","area":"I","diff":3,"q":"The current ratio is 2.0. Paying an account payable with cash will:","choices":["Decrease the current ratio","Increase the current ratio","Leave it unchanged","Depend on the amount"],"answer":1,"why":"When the ratio starts above 1.0, subtracting equal amounts from both current assets and current liabilities raises the ratio. Below 1.0 it would fall.","tag":"Ratios","id":"8zyxpp"},{"section":"BAR","area":"I","diff":2,"q":"Return on equity is computed as:","choices":["Net income ÷ total assets","Net income ÷ average shareholders' equity","Operating income ÷ sales","Gross profit ÷ sales"],"answer":1,"why":"ROE = net income ÷ average equity. DuPont decomposes it into margin × asset turnover × equity multiplier.","tag":"Ratios","id":"90leo6"},{"section":"BAR","area":"II","diff":3,"q":"A derivative designated as a CASH FLOW hedge records the effective portion of gains and losses in:","choices":["Net income immediately","Other comprehensive income until the hedged transaction affects earnings","Retained earnings directly","The investment account"],"answer":1,"why":"Cash flow hedges park the effective portion in OCI and reclassify when the forecasted transaction hits earnings. Fair value hedges go straight to net income.","tag":"Derivatives","id":"98mo0b"},{"section":"BAR","area":"II","diff":2,"q":"Stock-based compensation for equity-classified awards is measured at:","choices":["Intrinsic value at each reporting date","Grant-date fair value, recognized over the requisite service period","The exercise price","Cash paid on exercise"],"answer":1,"why":"Grant-date fair value is fixed and expensed over the vesting period. Liability-classified awards, by contrast, are remeasured each period.","tag":"Stock compensation","id":"14gbv4c"},{"section":"BAR","area":"III","diff":3,"q":"Governmental fund financial statements are prepared using:","choices":["Full accrual accounting","Modified accrual accounting and the current financial resources measurement focus","Cash basis","The economic resources measurement focus"],"answer":1,"why":"Governmental FUNDS use modified accrual — revenue when measurable and available. Government-wide statements and proprietary funds use full accrual.","tag":"GASB","id":"qo0m26"},{"section":"BAR","area":"III","diff":2,"q":"Under modified accrual, 'available' generally means collectible within:","choices":["The current period only","The current period or soon enough thereafter to pay current liabilities","Twelve months in all cases","Any future period"],"answer":1,"why":"Availability is the timing test unique to modified accrual; many governments use a 60-day window for property taxes.","tag":"GASB","id":"1nogfzm"},{"section":"BAR","area":"III","diff":2,"q":"Which is a GOVERNMENTAL fund type?","choices":["Enterprise fund","Internal service fund","Special revenue fund","Pension trust fund"],"answer":2,"why":"Governmental funds: General, Special Revenue, Capital Projects, Debt Service, Permanent. Enterprise and internal service are proprietary; pension trust is fiduciary.","tag":"GASB","id":"1nldprp"},{"section":"ISC","area":"I","diff":2,"q":"In a relational database, a FOREIGN key:","choices":["Uniquely identifies each row in its own table","References the primary key of another table to enforce referential integrity","Encrypts the table","Is always auto-incremented"],"answer":1,"why":"Foreign keys create and enforce relationships between tables. The primary key is what uniquely identifies rows within a table.","tag":"Data management","id":"1ai5abh"},{"section":"ISC","area":"I","diff":2,"q":"In an ETL process, the TRANSFORM step:","choices":["Moves data into the target system","Cleans, standardizes, validates, and reshapes data before loading","Extracts data from source systems","Backs up the data warehouse"],"answer":1,"why":"Transform is where deduplication, type conversion, and business rules are applied. In ELT the order flips and transformation happens after loading.","tag":"Data management","id":"9p8p4y"},{"section":"ISC","area":"I","diff":2,"q":"Which is an IT GENERAL control (ITGC) rather than an application control?","choices":["A three-way match on purchase orders","A field validation rejecting non-numeric input","Logical access provisioning and periodic user access reviews","A batch total reconciliation"],"answer":2,"why":"ITGCs are pervasive: access, change management, operations, backup. Application controls are transaction-level within a specific system.","tag":"ITGC","id":"9zhvo3"},{"section":"ISC","area":"I","diff":3,"q":"The primary risk of inadequate SEGREGATION OF DUTIES in an IT environment is that one person could:","choices":["Work excessive overtime","Both initiate a transaction and conceal it by altering the records","Reduce system performance","Increase storage costs"],"answer":1,"why":"Segregation separates authorization, recording, and custody so committing and concealing an error or fraud requires collusion.","tag":"SOD","id":"16wefuz"},{"section":"ISC","area":"II","diff":2,"q":"Data encrypted while stored on a disk is protected:","choices":["In transit","At rest","In use","In memory only"],"answer":1,"why":"At rest = stored. In transit = moving across a network (TLS). In use = being processed in memory.","tag":"Encryption","id":"1os6pxo"},{"section":"ISC","area":"II","diff":2,"q":"MULTI-FACTOR authentication requires factors from at least two of these categories:","choices":["Two different passwords","Something you know, something you have, something you are","Two different usernames","Password entered twice"],"answer":1,"why":"Two instances of the same category — a password plus a PIN — is not multi-factor.","tag":"Access control","id":"1gb2inc"},{"section":"ISC","area":"II","diff":3,"q":"The principle of LEAST PRIVILEGE means users are granted:","choices":["Administrative rights by default","Only the access necessary to perform their job duties","Access to all systems for efficiency","Read access to all data"],"answer":1,"why":"Least privilege limits the blast radius of a compromised account. It pairs with periodic access recertification to prevent privilege creep.","tag":"Access control","id":"1vg9ryq"},{"section":"ISC","area":"II","diff":3,"q":"RPO (recovery point objective) measures:","choices":["How long recovery takes","The maximum acceptable amount of DATA LOSS measured in time","The cost of the outage","The number of affected users"],"answer":1,"why":"RPO = how much data you can afford to lose, driving backup frequency. RTO = how long you can afford to be down.","tag":"BCP/DR","id":"143bw54"},{"section":"ISC","area":"III","diff":3,"q":"A SOC 1 report addresses:","choices":["Security, availability, processing integrity, confidentiality, and privacy","Controls at a service organization relevant to user entities' INTERNAL CONTROL OVER FINANCIAL REPORTING","The service organization's financial statements","Compliance with GDPR"],"answer":1,"why":"SOC 1 is ICFR-focused and used by user auditors. SOC 2 addresses the Trust Services Criteria.","tag":"SOC","id":"1yz2fhc"},{"section":"ISC","area":"III","diff":3,"q":"The difference between a Type 1 and a Type 2 SOC report is that Type 2:","choices":["Covers more control objectives","Tests OPERATING EFFECTIVENESS over a period of time, not just design at a point in time","Is issued by management","Is available to the general public"],"answer":1,"why":"Type 1 = design and implementation at a point in time. Type 2 = design plus operating effectiveness across a period, so it includes tests and results.","tag":"SOC","id":"qgn8yl"},{"section":"ISC","area":"III","diff":2,"q":"The five Trust Services Criteria are security, availability, processing integrity, confidentiality, and:","choices":["Profitability","Privacy","Efficiency","Accuracy"],"answer":1,"why":"Security is the required common criteria; the other four are included based on engagement scope.","tag":"SOC","id":"1fh95vh"},{"section":"TCP","area":"I","diff":3,"q":"A traditional IRA differs from a Roth IRA in that the traditional IRA generally offers:","choices":["Tax-free qualified distributions","A current-year deduction with taxable distributions later","No contribution limits","Exemption from required minimum distributions"],"answer":1,"why":"Traditional = deduct now, tax later. Roth = no deduction now, qualified distributions tax-free, and no RMDs for the original owner.","tag":"Retirement","id":"1l2g02q"},{"section":"TCP","area":"I","diff":2,"q":"The federal gift tax annual exclusion applies:","choices":["Once per donor per year in total","Per donee, per year","Only to gifts to charity","Only to gifts of cash"],"answer":1,"why":"The exclusion is per recipient each year, so gifts can be multiplied across donees, and doubled by gift-splitting between spouses.","tag":"Gift tax","id":"1l5ow1r"},{"section":"TCP","area":"I","diff":3,"q":"Which transfer qualifies for the UNLIMITED marital deduction?","choices":["A gift to a child","An outright transfer to a U.S. citizen spouse","A transfer to a non-citizen spouse","A transfer to a sibling"],"answer":1,"why":"Unlimited for U.S. citizen spouses. Transfers to non-citizen spouses use a limited annual exclusion or a QDOT.","tag":"Estate/gift","id":"n6xo1v"},{"section":"TCP","area":"II","diff":3,"q":"A distribution from an S corporation with no accumulated E&P is treated first as:","choices":["Ordinary dividend income","A tax-free reduction of stock basis","Capital gain","Wages subject to payroll tax"],"answer":1,"why":"Tax-free to the extent of basis, then capital gain for any excess. E&P from prior C corp years changes the ordering.","tag":"S corporation","id":"1tptoj3"},{"section":"TCP","area":"II","diff":3,"q":"A CURRENT (non-liquidating) partnership distribution of cash exceeding the partner's outside basis results in:","choices":["Ordinary income","Capital gain to the extent of the excess","No gain — basis simply goes negative","A deductible loss"],"answer":1,"why":"Outside basis cannot go below zero, so cash beyond basis triggers capital gain. Property distributions generally do not trigger gain.","tag":"Partnership","id":"gtrzoq"},{"section":"TCP","area":"III","diff":3,"q":"A key tax disadvantage of operating as a C corporation rather than a pass-through is:","choices":["Limited liability","Double taxation of distributed earnings","Inability to deduct salaries","Mandatory dissolution after 10 years"],"answer":1,"why":"Earnings are taxed at the entity level and again as dividends. Pass-throughs are taxed once at the owner level and may qualify for the 199A deduction.","tag":"Entity choice","id":"kieglm"},{"section":"TCP","area":"III","diff":2,"q":"Reasonable compensation is a particular audit focus for S corporations because owners may:","choices":["Overpay salaries to reduce corporate tax","Understate salaries to minimize payroll taxes on distributions","Avoid filing returns","Deduct personal expenses"],"answer":1,"why":"S corp distributions escape payroll tax, so understating wages shifts income away from FICA. The IRS recharacterizes unreasonably low salaries.","tag":"Entity planning","id":"l2kk5c"},{"section":"TCP","area":"IV","diff":3,"q":"Under the INSTALLMENT method, gain is recognized:","choices":["Entirely in the year of sale","As payments are received, using the gross profit percentage","Only in the final year","Only when the buyer defaults"],"answer":1,"why":"Gain recognized = payment received × gross profit percentage. Depreciation recapture, however, is recognized in full in the year of sale.","tag":"Installment sales","id":"1rox7x5"},{"section":"TCP","area":"IV","diff":3,"q":"Section 1231 nets gains and losses on business property. A NET Section 1231 gain is generally treated as:","choices":["Ordinary income","Long-term capital gain, subject to the five-year lookback recapture rule","Tax-exempt","Short-term capital gain"],"answer":1,"why":"Net 1231 gain gets capital treatment; a net 1231 loss is fully ordinary — the best of both. The lookback recharacterizes gain as ordinary to the extent of unrecaptured 1231 losses in the prior five years.","tag":"Section 1231","id":"1bj6pb6"},{"section":"FAR","area":"I","diff":2,"q":"A company receives $12,000 on Oct 1 for a one-year service contract. Under accrual accounting, how much revenue is recognized by Dec 31?","choices":["$0","$3,000","$9,000","$12,000"],"answer":1,"why":"3 of 12 months earned → $12,000 × 3/12 = $3,000; the rest is unearned (deferred) revenue.","tag":"daily bank","id":"1mcgp18"},{"section":"FAR","area":"I","diff":2,"q":"Which inventory method generally produces the HIGHEST net income in a period of rising prices?","choices":["LIFO","FIFO","Weighted average","Specific identification"],"answer":1,"why":"FIFO expenses the oldest (cheapest) costs to COGS, leaving lower COGS and higher income when prices rise.","tag":"daily bank","id":"1n5vv9z"},{"section":"FAR","area":"I","diff":2,"q":"Goodwill is recognized when:","choices":["A company generates it internally over time","Purchase price of an acquired business exceeds the fair value of identifiable net assets","Fair value of net assets exceeds the purchase price","A patent is amortized"],"answer":1,"why":"Goodwill = consideration transferred − fair value of identifiable net assets acquired. Internally generated goodwill is never recorded.","tag":"daily bank","id":"tst1q6"},{"section":"FAR","area":"I","diff":2,"q":"A bond issued at a discount will have an interest expense (effective-interest method) that, each period, is:","choices":["Equal to the cash paid","Less than the cash paid","Greater than the cash paid","Zero"],"answer":2,"why":"Discount bonds: interest expense = carrying value × market rate, which exceeds the cash coupon; the difference amortizes the discount.","tag":"daily bank","id":"tqlaih"},{"section":"FAR","area":"I","diff":2,"q":"Treasury stock is reported on the balance sheet as:","choices":["An asset","A contra-equity account","A liability","Revenue"],"answer":1,"why":"Treasury stock reduces total stockholders' equity — it's a contra-equity account, never an asset.","tag":"daily bank","id":"12a3bhg"},{"section":"AUD","area":"I","diff":2,"q":"Which type of audit opinion is issued when financial statements are fairly presented in all material respects?","choices":["Qualified","Adverse","Unmodified (unqualified)","Disclaimer"],"answer":2,"why":"An unmodified opinion is the clean 'fairly presented' opinion. The others signal a problem or a scope limitation.","tag":"daily bank","id":"dgnhs0"},{"section":"AUD","area":"I","diff":2,"q":"Inherent risk and control risk together make up:","choices":["Detection risk","Audit risk","Risk of material misstatement","Sampling risk"],"answer":2,"why":"RMM = inherent risk × control risk. Audit risk = RMM × detection risk.","tag":"daily bank","id":"1vdhjq9"},{"section":"AUD","area":"I","diff":2,"q":"An auditor's independence is MOST clearly impaired by:","choices":["Auditing a company in an industry they specialize in","Owning shares of the audit client","Having audited the client for many years","Charging a fixed fee"],"answer":1,"why":"A direct financial interest (owning the client's stock) impairs independence in fact and appearance.","tag":"daily bank","id":"6x527l"},{"section":"AUD","area":"I","diff":2,"q":"The purpose of a management representation letter is to:","choices":["Replace substantive audit procedures","Corroborate other evidence and confirm management's responsibility","Give the auditor legal immunity","Serve as the audit opinion"],"answer":1,"why":"The rep letter corroborates evidence and documents management's acknowledgment of its responsibilities — it does not replace testing.","tag":"daily bank","id":"a296o1"},{"section":"REG","area":"I","diff":2,"q":"For a single taxpayer in 2024, long-term capital gains are taxed at a preferential rate because the asset was held for:","choices":["More than 6 months","More than 1 year","More than 2 years","Any length of time"],"answer":1,"why":"Long-term treatment requires a holding period of more than one year; one year or less is short-term (ordinary rates).","tag":"daily bank","id":"1u8vnaa"},{"section":"REG","area":"I","diff":2,"q":"Which entity generally provides its owners LIMITED liability AND pass-through taxation by default?","choices":["C corporation","General partnership","Sole proprietorship","LLC"],"answer":3,"why":"An LLC gives limited liability and, by default, pass-through taxation (single-member = disregarded; multi-member = partnership).","tag":"daily bank","id":"d5rooa"},{"section":"REG","area":"I","diff":2,"q":"The 'wash sale' rule disallows a loss when substantially identical stock is repurchased within:","choices":["7 days","30 days before or after","60 days after only","1 year"],"answer":1,"why":"A wash sale occurs if you buy substantially identical securities within 30 days before OR after the sale; the loss is deferred, not lost.","tag":"daily bank","id":"1mdb8hz"},{"section":"REG","area":"I","diff":2,"q":"Under the accrual method, an expense is generally deductible when:","choices":["It is paid in cash","The all-events test is met and economic performance occurs","It is authorized by the board","The invoice is received"],"answer":1,"why":"Accrual deductions require the all-events test (fixed liability + determinable amount) AND economic performance.","tag":"daily bank","id":"1w4ahnz"},{"section":"BAR","area":"I","diff":2,"q":"A company's degree of operating leverage is high when it has:","choices":["Mostly variable costs","Mostly fixed costs","No costs","Only period costs"],"answer":1,"why":"High fixed costs magnify the effect of sales changes on operating income → high operating leverage.","tag":"daily bank","id":"m4trg3"},{"section":"BAR","area":"I","diff":2,"q":"Contribution margin equals:","choices":["Sales − fixed costs","Sales − variable costs","Sales − total costs","Fixed costs ÷ units"],"answer":1,"why":"Contribution margin = sales − variable costs; it's what's left to cover fixed costs and profit.","tag":"daily bank","id":"18kqwoe"},{"section":"BAR","area":"I","diff":2,"q":"In the DuPont framework, Return on Equity is driven by profit margin, asset turnover, and:","choices":["Dividend payout","The equity (financial-leverage) multiplier","Tax rate only","Inventory days"],"answer":1,"why":"ROE = net profit margin × asset turnover × equity multiplier (assets/equity).","tag":"daily bank","id":"1czjo0c"},{"section":"ISC","area":"I","diff":2,"q":"The security principle that grants users only the access needed to do their job is called:","choices":["Segregation of duties","Least privilege","Defense in depth","Change management"],"answer":1,"why":"Least privilege limits each user's access to the minimum required, shrinking the attack surface.","tag":"daily bank","id":"1rtro96"},{"section":"ISC","area":"I","diff":2,"q":"In a SOC 1 report, the controls being examined relate to:","choices":["A service organization's controls over financial reporting","Cybersecurity marketing claims","The user entity's tax return","Physical building security only"],"answer":0,"why":"SOC 1 addresses controls at a service organization relevant to user entities' internal control over financial reporting (ICFR).","tag":"daily bank","id":"1hfumw6"},{"section":"TCP","area":"I","diff":2,"q":"A taxpayer contributing appreciated property to a partnership generally recognizes:","choices":["Gain equal to the full appreciation","No gain (nonrecognition under §721)","Ordinary income","A capital loss"],"answer":1,"why":"§721 provides nonrecognition on contributions of property to a partnership in exchange for an interest (built-in gain is tracked).","tag":"daily bank","id":"1nikygz"},{"section":"TCP","area":"I","diff":2,"q":"An S corporation shareholder's basis is INCREASED by:","choices":["Distributions received","Their share of separately and non-separately stated income","Nondeductible expenses","Corporate borrowing"],"answer":1,"why":"Stock basis rises with the shareholder's share of income items; it falls with distributions, losses, and nondeductible expenses.","tag":"daily bank","id":"qmfhm9"}]}</script>
<script>
const D = JSON.parse(document.getElementById("bank").textContent);
const Q = D.questions, SEC = D.sections;
const KEY = "cpaTrainer.v1";
const $ = (s,r)=>(r||document).querySelector(s);
const esc = (s)=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SC = {FAR:"var(--s1)",AUD:"var(--s2)",REG:"var(--s3)",BAR:"var(--s4)",ISC:"var(--s5)",TCP:"var(--s6)"};
const LTR = ["A","B","C","D"];
const DAY = 864e5;

const OK = '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M6.2 11.5 3 8.3l1.1-1.1 2.1 2.1 5.6-5.6L13 4.8z"/></svg>';
const NO = '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M12.7 4.4 11.6 3.3 8 6.9 4.4 3.3 3.3 4.4 6.9 8l-3.6 3.6 1.1 1.1L8 9.1l3.6 3.6 1.1-1.1L9.1 8z"/></svg>';

/* ------------------------------------------------------------- storage */

const blank = () => ({ section:"FAR", cards:{}, log:[], streak:{n:0,last:""}, exams:[] });
let S = load();
function load(){
  try { const r = JSON.parse(localStorage.getItem(KEY)); return r && r.cards ? {...blank(),...r} : blank(); }
  catch { return blank(); }
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} }
const today = () => new Date().toISOString().slice(0,10);

/* SM-2, adapted: MCQs grade themselves, so quality comes from correctness
   plus whether the answer was a guess. */
function schedule(id, quality){
  const c = S.cards[id] || { ease:2.5, reps:0, interval:0, due:0, seen:0, right:0 };
  c.seen++;
  if (quality >= 3) {
    c.right++;
    c.reps++;
    c.interval = c.reps === 1 ? 1 : c.reps === 2 ? 4 : Math.round(c.interval * c.ease);
  } else {
    c.reps = 0;
    c.interval = 0;               // back in today's queue
  }
  c.ease = Math.max(1.3, c.ease + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02)));
  c.due = Date.now() + c.interval * DAY;
  c.last = today();
  S.cards[id] = c;

  S.log.push({ id, t: Date.now(), q: quality });
  if (S.log.length > 4000) S.log = S.log.slice(-4000);

  const d = today();
  if (S.streak.last !== d) {
    const y = new Date(Date.now()-DAY).toISOString().slice(0,10);
    S.streak.n = S.streak.last === y ? S.streak.n + 1 : 1;
    S.streak.last = d;
  }
  save();
}

/* --------------------------------------------------------------- model */

const inSection = () => Q.filter(q => q.section === S.section);
const isDue = (q) => { const c = S.cards[q.id]; return !c || c.due <= Date.now(); };

/* Weakest-first: unseen questions, then lowest accuracy, then due date. */
function queue(){
  const list = inSection().filter(isDue);
  return list.sort((a,b)=>{
    const ca = S.cards[a.id], cb = S.cards[b.id];
    if (!ca && cb) return -1;
    if (ca && !cb) return 1;
    if (!ca && !cb) return a.diff - b.diff;
    return (ca.right/ca.seen) - (cb.right/cb.seen) || ca.due - cb.due;
  });
}

function areaStats(section){
  const out = {};
  for (const key of Object.keys(SEC[section].areas)) out[key] = { seen:0, right:0, total:0, attempted:0 };
  for (const q of Q.filter(x=>x.section===section)) {
    const a = out[q.area]; if (!a) continue;
    a.total++;
    const c = S.cards[q.id];
    if (c && c.seen) { a.seen += c.seen; a.right += c.right; a.attempted++; }
  }
  return out;
}

/* Blueprint-weighted readiness. Unseen areas contribute nothing, so the number
   climbs only as coverage grows — it should not read 100% off three questions. */
function readiness(section){
  const st = areaStats(section), areas = SEC[section].areas;
  let score = 0, covW = 0, totalW = 0;
  for (const [k,a] of Object.entries(areas)) {
    const w = (a.weight[0]+a.weight[1])/2;
    totalW += w;
    const s = st[k];
    if (!s.total) continue;
    /* Coverage is the share of an area's questions actually attempted — not
       whether it has been touched at all, which would read 100% off one card. */
    const covered = s.attempted / s.total;
    covW += w * covered;
    if (!s.seen) continue;
    score += w * (s.right/s.seen) * covered;
  }
  return { pct: totalW ? Math.round(score/totalW*100) : 0, coverage: totalW ? Math.round(covW/totalW*100) : 0 };
}

const tone = (p) => p >= 75 ? "var(--good)" : p >= 50 ? "var(--warning)" : p >= 25 ? "var(--serious)" : "var(--critical)";

/* --------------------------------------------------------------- shell */

let tab = "study", session = null, exam = null;

function render(){
  $("#app").innerHTML =
    '<div class="bar-top"><div class="brand"><span class="mark">CPA</span>Trainer</div>'
    + '<div class="tools"><button class="ghost" id="themeBtn">Theme</button>'
    + '<button class="ghost" id="dataBtn">Data</button></div></div>'
    + '<div class="secbar">' + Object.keys(SEC).map(k=>{
        const n = Q.filter(q=>q.section===k).length;
        return '<button class="secbtn" data-sec="'+k+'" aria-pressed="'+(S.section===k)+'">'
             + k + '<i>' + n + '</i></button>';
      }).join("") + '</div>'
    + '<div class="tabs">' + [["study","Study"],["exam","Exam"],["progress","Progress"]].map(([k,l])=>
        '<button class="tab" data-tab="'+k+'" aria-selected="'+(tab===k)+'">'+l+'</button>').join("") + '</div>'
    + '<div id="body"></div>'
    + '<div class="foot">' + Q.length + ' questions · saved on this device only<br>'
    + 'Figures adjusted for inflation are marked with a tax year — verify against the year you sit.</div>';

  $("#themeBtn").onclick = ()=>{
    const r = document.documentElement, c = r.getAttribute("data-theme");
    r.setAttribute("data-theme", c==="dark"?"light":c==="light"?"":"dark");
  };
  $("#dataBtn").onclick = dataPanel;
  document.querySelectorAll(".secbtn").forEach(b=>b.onclick=()=>{
    S.section=b.dataset.sec; save(); session=null; exam=null; render();
  });
  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{ tab=b.dataset.tab; render(); });

  ({ study:studyView, exam:examView, progress:progressView })[tab]();
}

/* --------------------------------------------------------------- study */

function studyView(){
  if (session && session.i < session.list.length) return drawQuestion();
  if (session) return drawSessionEnd();

  const due = queue().length;
  const total = inSection().length;
  const r = readiness(S.section);

  $("#body").innerHTML =
      '<div class="tiles">'
    +   tile(due, "Due now") + tile(r.pct+"%", "Readiness") + tile(r.coverage+"%","Coverage")
    +   tile(S.streak.n, "Day streak")
    + '</div>'
    + '<div class="card"><div class="row"><div><h3>' + S.section + ' — ' + esc(SEC[S.section].name) + '</h3>'
    + '<div class="kicker">' + total + ' questions in this section · weakest and unseen come first</div></div></div>'
    + '<div class="btnrow" style="margin-top:16px">'
    +   '<button class="btn" id="startBtn"' + (due?"":" disabled") + '>'
    +   (due ? 'Study ' + Math.min(15,due) + ' questions' : 'Nothing due — come back tomorrow') + '</button>'
    + '</div>'
    + (due ? '' : '<div class="btnrow" style="margin-top:8px"><button class="btn sec" id="anyBtn">Review anyway</button></div>')
    + '</div>'
    + areaCard(S.section);

  const go = (all)=>{
    const list = all ? shuffle(inSection()).slice(0,15) : queue().slice(0,15);
    if(!list.length) return;
    session = { list, i:0, right:0, answers:[] };
    render();
  };
  if ($("#startBtn")) $("#startBtn").onclick = ()=>go(false);
  if ($("#anyBtn")) $("#anyBtn").onclick = ()=>go(true);
}

const tile = (v,k)=>'<div class="tile"><div class="v">'+v+'</div><div class="k">'+esc(k)+'</div></div>';

function areaCard(section){
  const st = areaStats(section), areas = SEC[section].areas;
  return '<div class="card"><h3>By blueprint area</h3>'
    + '<div class="kicker">Percentages are the AICPA blueprint weight for this section</div>'
    + '<div style="margin-top:10px">' + Object.entries(areas).map(([k,a])=>{
        const s = st[k], acc = s.seen ? Math.round(s.right/s.seen*100) : 0;
        return '<div class="arow"><div class="t"><span class="n">' + esc(a.name) + '</span>'
          + '<span class="m">' + a.weight[0] + '–' + a.weight[1] + '% · '
          + (s.seen ? acc + '% correct' : 'not started') + '</span></div>'
          + '<div class="meter"><i style="width:' + (s.seen?acc:0) + '%;background:' + (s.seen?tone(acc):"var(--grid)") + '"></i></div></div>';
      }).join("") + '</div></div>';
}

function drawQuestion(){
  const q = session.list[session.i];
  const picked = session.picked;
  const done = picked !== undefined && picked !== null;

  $("#body").innerHTML =
      '<div class="prog"><i style="width:' + (session.i/session.list.length*100) + '%"></i></div>'
    + '<div class="qmeta"><span class="pillx" style="border-color:' + SC[q.section] + ';color:' + SC[q.section] + '">'
    +   q.section + '</span><span class="pillx">Area ' + q.area + '</span>'
    +   (q.tag ? '<span class="pillx">' + esc(q.tag) + '</span>' : '')
    +   '<span class="pillx" style="margin-left:auto">' + (session.i+1) + ' / ' + session.list.length + '</span></div>'
    + '<div class="qtext">' + esc(q.q) + '</div>'
    + q.choices.map((c,i)=>{
        let cls = "choice";
        if (done) {
          if (i === q.answer) cls += " correct";
          else if (i === picked) cls += " wrong";
        }
        return '<button class="' + cls + '" data-i="' + i + '"' + (done?" disabled":"") + '>'
             + '<span class="ltr">' + LTR[i] + '</span><span>' + esc(c) + '</span></button>';
      }).join("")
    + (done ? feedback(q, picked) : '<div class="kicker" style="margin-top:12px">Pick an answer — or press '
        + '<span class="kbd">1</span>–<span class="kbd">4</span></div>');

  document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>answer(Number(b.dataset.i)));
  if (done) {
    $("#nextBtn").onclick = next;
    if ($("#guessBtn")) $("#guessBtn").onclick = ()=>{
      const q2 = session.list[session.i];
      schedule(q2.id, 2);                       // downgrade a lucky guess
      $("#guessBtn").textContent = "Marked as a guess";
      $("#guessBtn").disabled = true;
    };
  }
}

function feedback(q, picked){
  const ok = picked === q.answer;
  return '<div class="why"><div class="verdict ' + (ok?"v-ok":"v-no") + '">' + (ok?OK:NO)
    + (ok ? 'Correct' : 'Not quite — the answer is ' + LTR[q.answer]) + '</div>'
    + '<b>Why:</b> ' + esc(q.why) + '</div>'
    + '<div class="btnrow">'
    + '<button class="btn" id="nextBtn" style="flex:1">'
    + (session.i+1 >= session.list.length ? 'Finish' : 'Next') + '</button>'
    + (ok ? '<button class="btn sec sm" id="guessBtn">That was a guess</button>' : '')
    + '</div>';
}

function answer(i){
  if (session.picked !== undefined && session.picked !== null) return;
  const q = session.list[session.i];
  const ok = i === q.answer;
  session.picked = i;
  if (ok) session.right++;
  session.answers.push({ id:q.id, ok });
  schedule(q.id, ok ? 4 : 0);
  drawQuestion();
}

function next(){
  session.picked = null;
  session.i++;
  session.picked = undefined;
  render();
}

function drawSessionEnd(){
  const pct = Math.round(session.right/session.list.length*100);
  const missed = session.answers.filter(a=>!a.ok).map(a=>Q.find(q=>q.id===a.id));
  $("#body").innerHTML =
      '<div class="card" style="text-align:center;padding:28px 18px">'
    +   '<div style="font-size:44px;font-weight:680;letter-spacing:-.03em;color:' + tone(pct) + '">' + pct + '%</div>'
    +   '<div class="kicker">' + session.right + ' of ' + session.list.length + ' correct</div>'
    + '</div>'
    + (missed.length ? '<div class="card"><h3>Worth another look</h3>'
        + '<div class="kicker">These are back in tomorrow\u2019s queue</div><div style="margin-top:10px">'
        + missed.map(q=>'<div class="arow"><div class="t"><span class="n">' + esc(q.q.slice(0,86))
          + (q.q.length>86?'\u2026':'') + '</span><span class="m">' + q.section + ' ' + q.area + '</span></div></div>').join("")
        + '</div></div>' : '')
    + '<button class="btn" id="againBtn">Back to study</button>';
  $("#againBtn").onclick = ()=>{ session=null; render(); };
}

/* ---------------------------------------------------------------- exam */

function examView(){
  if (exam && !exam.done) return drawExam();
  if (exam && exam.done) return drawExamReport();

  const avail = inSection().length;
  $("#body").innerHTML =
      '<div class="card"><h3>Timed testlet</h3>'
    + '<div class="kicker">No feedback until the end, 1.5 minutes per question — the pace the real exam runs at. '
    + 'Answers still feed spaced repetition.</div>'
    + '<div class="btnrow" style="margin-top:16px">'
    + [10,25,50].filter(n=>n<=avail).map(n=>'<button class="btn sec sm" data-n="'+n+'">'+n+' questions</button>').join("")
    + '</div></div>'
    + (S.exams.length ? '<div class="card"><h3>Past testlets</h3><div style="margin-top:8px">'
        + S.exams.slice(-8).reverse().map(e=>'<div class="arow"><div class="t">'
          + '<span class="n">' + e.section + ' · ' + e.n + ' questions</span>'
          + '<span class="m">' + e.pct + '% · ' + new Date(e.t).toLocaleDateString() + '</span></div></div>').join("")
        + '</div></div>' : '');

  document.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{
    const n = Number(b.dataset.n);
    exam = { list: shuffle(inSection()).slice(0,n), i:0, picks:{}, ends: Date.now() + n*90000, done:false };
    render(); tick();
  });
}

let timerId = null;
function tick(){
  clearInterval(timerId);
  timerId = setInterval(()=>{
    if (!exam || exam.done) return clearInterval(timerId);
    const left = exam.ends - Date.now();
    const el = $("#timer");
    if (!el) return;
    if (left <= 0) { finishExam(); return; }
    const m = Math.floor(left/60000), s = Math.floor(left%60000/1000);
    el.textContent = m + ":" + String(s).padStart(2,"0");
    el.classList.toggle("low", left < 60000);
  }, 250);
}

function drawExam(){
  const q = exam.list[exam.i];
  const picked = exam.picks[exam.i];
  $("#body").innerHTML =
      '<div class="row" style="margin-bottom:10px"><span class="kicker">Question ' + (exam.i+1) + ' of ' + exam.list.length + '</span>'
    + '<span class="timer" id="timer">—</span></div>'
    + '<div class="prog"><i style="width:' + ((exam.i)/exam.list.length*100) + '%"></i></div>'
    + '<div class="qmeta"><span class="pillx" style="border-color:' + SC[q.section] + ';color:' + SC[q.section] + '">'
    + q.section + '</span><span class="pillx">Area ' + q.area + '</span></div>'
    + '<div class="qtext">' + esc(q.q) + '</div>'
    + q.choices.map((c,i)=>'<button class="choice' + (picked===i?" picked":"") + '" data-i="'+i+'">'
        + '<span class="ltr">' + LTR[i] + '</span><span>' + esc(c) + '</span></button>').join("")
    + '<div class="btnrow" style="margin-top:14px">'
    + (exam.i>0?'<button class="btn sec sm" id="prevQ">Back</button>':'')
    + '<button class="btn" id="nextQ" style="flex:1">'
    + (exam.i+1>=exam.list.length?'Submit testlet':'Next') + '</button></div>';

  document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{
    exam.picks[exam.i] = Number(b.dataset.i); drawExam(); tick();
  });
  if ($("#prevQ")) $("#prevQ").onclick = ()=>{ exam.i--; drawExam(); tick(); };
  $("#nextQ").onclick = ()=>{
    if (exam.i+1 >= exam.list.length) finishExam();
    else { exam.i++; drawExam(); tick(); }
  };
}

function finishExam(){
  clearInterval(timerId);
  let right = 0;
  exam.list.forEach((q,i)=>{
    const ok = exam.picks[i] === q.answer;
    if (ok) right++;
    schedule(q.id, ok ? 4 : 0);
  });
  exam.right = right;
  exam.pct = Math.round(right/exam.list.length*100);
  exam.done = true;
  S.exams.push({ t:Date.now(), section:S.section, n:exam.list.length, pct:exam.pct });
  save();
  render();
}

function drawExamReport(){
  const byArea = {};
  exam.list.forEach((q,i)=>{
    const a = byArea[q.area] || (byArea[q.area] = {n:0,r:0});
    a.n++; if (exam.picks[i]===q.answer) a.r++;
  });
  $("#body").innerHTML =
      '<div class="card" style="text-align:center;padding:28px 18px">'
    +   '<div style="font-size:44px;font-weight:680;letter-spacing:-.03em;color:' + tone(exam.pct) + '">' + exam.pct + '%</div>'
    +   '<div class="kicker">' + exam.right + ' of ' + exam.list.length + ' correct</div>'
    +   '<div class="kicker" style="margin-top:8px">The real exam scales scores and includes simulations — '
    +   'treat this as a pace and recall check, not a predicted score.</div>'
    + '</div>'
    + '<div class="card"><h3>By area</h3><div style="margin-top:8px">'
    + Object.entries(byArea).map(([k,a])=>{
        const p = Math.round(a.r/a.n*100);
        return '<div class="arow"><div class="t"><span class="n">' + esc(SEC[S.section].areas[k].name) + '</span>'
          + '<span class="m">' + a.r + '/' + a.n + '</span></div>'
          + '<div class="meter"><i style="width:'+p+'%;background:'+tone(p)+'"></i></div></div>';
      }).join("") + '</div></div>'
    + '<div class="card"><h3>Review</h3><div style="margin-top:8px">'
    + exam.list.map((q,i)=>{
        const ok = exam.picks[i]===q.answer;
        return '<div class="arow"><div class="t"><span class="n">'
          + (ok?'<span style="color:var(--good)">'+OK+'</span> ':'<span style="color:var(--critical)">'+NO+'</span> ')
          + esc(q.q.slice(0,80)) + (q.q.length>80?'\u2026':'') + '</span></div>'
          + (ok?'':'<div class="kicker" style="margin-top:5px">' + esc(q.why) + '</div>') + '</div>';
      }).join("") + '</div></div>'
    + '<button class="btn" id="doneEx">Done</button>';
  $("#doneEx").onclick = ()=>{ exam=null; render(); };
}

/* ------------------------------------------------------------ progress */

function progressView(){
  const totalSeen = Object.values(S.cards).reduce((n,c)=>n+c.seen,0);
  const totalRight = Object.values(S.cards).reduce((n,c)=>n+c.right,0);
  const acc = totalSeen ? Math.round(totalRight/totalSeen*100) : 0;
  const last7 = S.log.filter(l=>l.t > Date.now()-7*DAY).length;

  $("#body").innerHTML =
      '<div class="tiles">' + tile(totalSeen,"Answers") + tile(acc+"%","Lifetime")
    + tile(last7,"Last 7 days") + tile(S.streak.n,"Day streak") + '</div>'
    + '<div class="card"><h3>Readiness by section</h3>'
    + '<div class="kicker">Blueprint-weighted accuracy, damped by how much of the section you have covered</div>'
    + '<div style="margin-top:10px">' + Object.keys(SEC).map(k=>{
        const r = readiness(k);
        return '<div class="arow"><div class="t"><span class="n">' + k + ' · ' + esc(SEC[k].name)
          + (SEC[k].core?'':' <span class="pillx">discipline</span>') + '</span>'
          + '<span class="m">' + r.pct + '% · ' + r.coverage + '% covered</span></div>'
          + '<div class="meter"><i style="width:'+r.pct+'%;background:'+tone(r.pct)+'"></i></div></div>';
      }).join("") + '</div></div>'
    + areaCard(S.section);
}

/* ---------------------------------------------------------------- data */

function dataPanel(){
  tab = "progress"; render();
  const c = document.createElement("div");
  c.className = "card";
  c.innerHTML = '<h3>Your data</h3><div class="kicker">Nothing leaves this device. Export before clearing your browser.</div>'
    + '<div class="btnrow" style="margin-top:14px">'
    + '<button class="btn sec sm" id="expBtn">Export JSON</button>'
    + '<label class="btn sec sm" style="text-align:center">Import<input type="file" id="impIn" accept="application/json" class="sr"></label>'
    + '<button class="btn sec sm" id="rstBtn" style="color:var(--critical)">Reset progress</button></div>';
  $("#body").prepend(c);

  $("#expBtn").onclick = ()=>{
    const b = new Blob([JSON.stringify(S,null,2)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(b);
    a.download = "cpa-trainer-" + today() + ".json";
    a.click(); URL.revokeObjectURL(a.href);
  };
  $("#impIn").onchange = (e)=>{
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ()=>{ try { const j = JSON.parse(r.result); if(j.cards){ S={...blank(),...j}; save(); render(); } } catch{} };
    r.readAsText(f);
  };
  $("#rstBtn").onclick = ()=>{
    if (confirm("Erase all progress on this device? Export first if you want a copy.")) {
      S = blank(); save(); render();
    }
  };
}

/* --------------------------------------------------------------- utils */

function shuffle(a){
  const x = a.slice();
  for (let i=x.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [x[i],x[j]]=[x[j],x[i]]; }
  return x;
}

document.addEventListener("keydown",(e)=>{
  if (e.metaKey||e.ctrlKey||e.altKey) return;
  const n = Number(e.key);
  if (n>=1 && n<=4) {
    const b = document.querySelectorAll(".choice")[n-1];
    if (b && !b.disabled) { b.click(); e.preventDefault(); }
  }
  if (e.key==="Enter"||e.key===" ") {
    const b = $("#nextBtn") || $("#nextQ");
    if (b) { b.click(); e.preventDefault(); }
  }
});

render();
</script>
</body>
</html>
